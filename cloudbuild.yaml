# cloudbuild.yaml - Versão com mais configurações
steps:
  # Etapa 1: Construir a imagem
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'southamerica-east1-docker.pkg.dev/site-logos-471718/cloud-run-source-deploy/django-site-logos/django-site-logos:$COMMIT_SHA',
      '-t', 'southamerica-east1-docker.pkg.dev/site-logos-471718/cloud-run-source-deploy/django-site-logos/django-site-logos:latest',
      '.'
    ]

  # Etapa 2: Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'southamerica-east1-docker.pkg.dev/site-logos-471718/cloud-run-source-deploy/django-site-logos/django-site-logos']

  # Etapa 3: Deploy para Cloud Run com todas as configurações
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'django-site-logos'
      - '--image=southamerica-east1-docker.pkg.dev/site-logos-471718/cloud-run-source-deploy/django-site-logos/django-site-logos:$COMMIT_SHA'
      - '--region=southamerica-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1000m'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--timeout=300s'
      - '--concurrency=80'
      - '--set-env-vars=DEBUG=False,GCP_SERVICE_URL=django-site-logos-640725377905.southamerica-east1.run.app'
      - '--set-cloudsql-instances=site-logos-471718:southamerica-east1:django-site-instance'
      - '--set-secrets=SECRET_KEY=SECRET_KEY:latest,DB_NAME=DB_NAME:latest,DB_USER=DB_USER:latest,DB_PASS=DB_PASS:latest,RUDDERSTACK_PYTHON_WRITE_KEY=RUDDERSTACK_PYTHON_WRITE_KEY:latest,RUDDERSTACK_DATA_PLANE_URL=RUDDERSTACK_DATA_PLANE_URL:latest,CELERY_BROKER_URL=CELERY_BROKER_URL:latest'

# Substituições disponíveis
substitutions:
  _SERVICE_NAME: 'django-site-logos'
  _REGION: 'southamerica-east1'

# Configurações do build
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '1200s'