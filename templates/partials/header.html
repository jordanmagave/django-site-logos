<header class="header-style-one header--sticky">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="header-style-one-wrapper">
          <div class="logo-area">
            <a href="{% url 'index' %}" class="logo">
            <img
              class="light"
              src="\static\images\logo\logo-horizontal-colorida-azul.svg"
              alt="logo"
              width="100%"
            />
            <img
              class="dark"
              src="\static\images\logo\logo-horizontal-colorida-branca.svg"
              alt="logo"
              width="100%"
            />
            </a>
          </div>
          <nav class="main-nav-area">
            <ul class="list-unstyled fluxi-desktop-menu">
              <li class="menu-item fluxi-has-dropdown">
                <a href="{% url 'index' %}" class="fluxi-dropdown-main-element"
                  >Home</a
                >
              </li>
              <li class="menu-item fluxi-has-dropdown">
                <a href="{% url 'about' %}" class="fluxi-dropdown-main-element" onclick="rudderanalytics.track('Click Sobre Nos', {local: 'Menu', page: 'Home'})"

              </li>
              <li class="menu-item fluxi-has-dropdown">

                    <a class="nav-link page" href="{% url 'educacaoInfantil' %}" onclick="rudderanalytics.track('Click Servicos', {service: 'Educação Infantil', local: 'Serviços Educacionais Home', page: 'Home'})"

                  <li class="nav-item">
                    <a

                      href="{% url 'ensinoFundamental' %}" onclick="rudderanalytics.track('Click Servicos', {service: 'Ensino Fundamental I', local: 'Serviços Educacionais Home', page: 'Home'})"

                  <li class="nav-item">
                    <a
                      class="nav-link page"
                      href="{% url 'ensinoFundamental2' %}" onclick="rudderanalytics.track('Click Servicos', {service: 'Ensino Fundamental II', local: 'Serviços Educacionais Home', page: 'Home'})"

                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="{% url 'ensinoMedio' %}" onclick="rudderanalytics.track('Click Servicos', {service: 'Ensino Médio', local: 'Serviços Educacionais Home', page: 'Home'})"

                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="{% url 'ensinoIntegral' %}" onclick="rudderanalytics.track('Click Servicos', {service: 'Ensino Integral', local: 'Serviços Educacionais Home', page: 'Home'})"

                    >
                  </li>
                </ul>
                <!-- End Dropdown Menu -->
              </li>
              <li class="menu-item fluxi-has-dropdown">
                <a href="https://sportcenter.typeform.com/concurso2026" target="_blank" class="fluxi-dropdown-main-element" onclick="rudderanalytics.track('Click Tour Virtual', {local: 'Menu', page: 'Home'})"

                >
              </li>
              <li class="menu-item fluxi-has-dropdown">
                <a href="https://www.sphere360.com.br/tour/logos/logos.html" target="_blank" class="fluxi-dropdown-main-element" onclick="rudderanalytics.track('Click Tour Virtual', {local: 'Menu', page: 'Home'})"

          <div class="button-area-start">

            >
            <div class="menu-btn" id="menu-btn">
              <svg
                width="20"
                height="16"
                viewBox="0 0 20 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"

                <rect y="14" width="20" height="2" fill="#1F1F25"></rect>
                <rect y="7" width="20" height="2" fill="#1F1F25"></rect>
                <rect width="20" height="2" fill="#1F1F25"></rect>
