<!-- Capture UTMs add anonymousId to URLs -->
<script>
  console.log("Debug Script: Iniciado.");

  // Função para capturar e salvar os UTMs
  function captureAndStoreUTMs() {
    try {
      const params = new URLSearchParams(window.location.search);
      const utmParams = {};
      const trackedParams = [
        "utm_source",
        "utm_medium",
        "utm_campaign",
        "utm_term",
        "utm_content",
        "gclid",
        "fbclid",
      ];
      let newParamsFound = false;

      trackedParams.forEach((param) => {
        if (params.has(param)) {
          utmParams[param] = params.get(param);
          newParamsFound = true;
        }
      });

      if (newParamsFound) {
        sessionStorage.setItem("utm_params", JSON.stringify(utmParams));
        console.log(
          "Debug Script: Novos UTMs encontrados e salvos na sessão:",
          utmParams
        );
      } else {
        console.log("Debug Script: Nenhum novo UTM encontrado na URL.");
      }
    } catch (e) {
      console.error("Debug Script: Erro ao capturar UTMs.", e);
    }
  }

  // Função para modificar os links da página
  function enrichAllLinks() {
    console.log("Debug Script: Tentando enriquecer os links...");
    const storedUtmParams = JSON.parse(sessionStorage.getItem("utm_params"));
    const anonymousId = analytics.user().anonymousId();

    if (!anonymousId) {
      console.error(
        "Debug Script: FALHA! O anonymousId do Segment não foi encontrado. Os links não serão modificados."
      );
      return;
    }

    console.log("Debug Script: ID anônimo do Segment encontrado:", anonymousId);
    if (storedUtmParams) {
      console.log("Debug Script: UTMs recuperados da sessão:", storedUtmParams);
    }

    document.querySelectorAll("a").forEach((link) => {
      try {
        // Ignora links que não são http/https (ex: mailto:, tel:)
        if (!link.href.startsWith("http")) return;

        const url = new URL(link.href, window.location.origin);

        if (url.hostname === window.location.hostname) {
          if (storedUtmParams) {
            Object.keys(storedUtmParams).forEach((key) => {
              url.searchParams.set(key, storedUtmParams[key]);
            });
          }
          url.searchParams.set("segment_anonymous_id", anonymousId);
          link.href = url.toString();
        }
      } catch (e) {
        console.error(
          "Debug Script: Erro ao modificar um link específico:",
          link.href,
          e
        );
      }
    });
    console.log("Debug Script: Processo de enriquecimento de links concluído.");
  }

  // Execução Principal
  document.addEventListener("DOMContentLoaded", function () {
    console.log("Debug Script: A página carregou (DOMContentLoaded).");
    captureAndStoreUTMs();

    // A forma mais segura de rodar o código é usando analytics.ready()
    if (typeof analytics !== "undefined" && analytics.ready) {
      console.log("Debug Script: Esperando o Segment ficar pronto...");
      analytics.ready(enrichAllLinks);
    } else {
      console.error(
        "Debug Script: Objeto 'analytics' do Segment não encontrado. O script não pode continuar."
      );
    }
  });
</script>
