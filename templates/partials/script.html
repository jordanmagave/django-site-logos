{% load static %}
<!-- jquery js -->
<script defer src="{% static 'js/plugins/jquery.min.js' %}"></script>

<script>
  // Função auxiliar para ler um cookie específico pelo nome
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
  }

  function enrichLinks() {
    console.log("Debug: Iniciando enrichLinks...");

    // 1. Pega os parâmetros UTM salvos na sessão do navegador
    const storedUtmParams = JSON.parse(sessionStorage.getItem("utm_params"));

    // 2. Garante que o Segment já carregou e pega o anonymousId
    if (typeof analytics !== "undefined" && analytics.user) {
      const anonymousId = analytics.user().anonymousId();

      // 3. Pega os cookies do Facebook
      const fbp = getCookie("_fbp");
      const fbc = getCookie("_fbc");

      console.log(`Debug: anonymousId=${anonymousId}, fbp=${fbp}, fbc=${fbc}`);

      // 4. Itera sobre todos os links da página
      document.querySelectorAll("a").forEach((link) => {
        try {
          const url = new URL(link.href, window.location.origin);

          if (url.hostname === window.location.hostname) {
            // Adiciona os parâmetros UTM, se existirem
            if (storedUtmParams) {
              Object.keys(storedUtmParams).forEach((key) => {
                url.searchParams.set(key, storedUtmParams[key]);
              });
            }

            // Adiciona o ID do Segment
            if (anonymousId) {
              url.searchParams.set("segment_anonymous_id", anonymousId);
            }

            // Adiciona os cookies do Facebook, se existirem
            if (fbp) {
              url.searchParams.set("fbp", fbp);
            }
            if (fbc) {
              url.searchParams.set("fbc", fbc);
            }

            link.href = url.toString();
          }
        } catch (e) {
          console.error("Erro ao enriquecer o link:", e, link.href);
        }
      });
      console.log("Debug: Links enriquecidos.");
    } else {
      console.log(
        "Debug: analytics.user não está pronto, tentando novamente em 500ms."
      );
      setTimeout(enrichLinks, 500); // Tenta novamente se o Segment não estiver pronto
    }
  }

  // Roda a função principal quando o Segment estiver pronto (LGPD-safe)
  if (typeof analytics !== "undefined") {
    analytics.ready(enrichLinks);
  }

  // Garante que a captura de UTMs da primeira visita ainda aconteça
  document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const utmParams = {};
    const trackedParams = [
      "utm_source",
      "utm_medium",
      "utm_campaign",
      "utm_term",
      "utm_content",
      "gclid",
      "fbclid",
      "gbraid",
      "wbraid",
    ];
    let newParamsFound = false;
    trackedParams.forEach((param) => {
      if (params.has(param)) {
        utmParams[param] = params.get(param);
        newParamsFound = true;
      }
    });
    if (newParamsFound) {
      sessionStorage.setItem("utm_params", JSON.stringify(utmParams));
    }
  });
</script>
