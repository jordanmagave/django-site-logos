{% load static %}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Critical CSS inline (CLS prevention) -->
  <style>
    .rts-banner-area-one.banner-five { min-height: 85vh; }
    .banner-one-right-content-with-img img.main-image-banner { width: 100%; height: auto; aspect-ratio: 1000/666; }
    body.loaded .loader-wrapper { display: none !important; }
  </style>

  <!-- SEO dinâmico -->
  <title>{% block head_title %}{{ page_title|default:"Centro Educacional Logos - Educação Cristã Integral" }}{% endblock %}</title>
  <meta name="description" content="{% block head_description %}{{ page_description|default:"Centro Educacional Logos: Educação Cristã Integral, líder em Ananindeua. Conheça nossos diferenciais e agende uma visita!" }}{% endblock %}" />
  <meta name="keywords" content="{{ page_keywords|default:"Centro Educacional Logos, Educação Cristã, Escola em Ananindeua, Ensino Fundamental, Ensino Médio" }}" />
  <meta name="author" content="Centro Educacional Logos" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{% block head_canonical %}{{ page_canonical|default:"https://www.celogos.com.br" }}{% endblock %}" />

  <!-- Open Graph -->
  <meta property="og:title" content="{% block og_title %}{{ og_title|default:page_title|default:"Centro Educacional Logos - Educação Cristã Integral" }}{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}{{ og_description|default:page_description|default:"Educação Cristã Integral, líder em Ananindeua. Conheça nossos diferenciais e agende uma visita!" }}{% endblock %}" />
  <meta property="og:image" content="{% block og_image %}{{ og_image|default:"https://www.celogos.com.br/static/images/logo/logo-1.svg" }}{% endblock %}" />
  <meta property="og:url" content="{% block og_url %}{{ page_canonical|default:"https://www.celogos.com.br" }}{% endblock %}" />
  <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Centro Educacional Logos" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}{{ og_title|default:page_title|default:"Centro Educacional Logos - Educação Cristã Integral" }}{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}{{ og_description|default:page_description|default:"Educação Cristã Integral, líder em Ananindeua. Conheça nossos diferenciais e agende uma visita!" }}{% endblock %}" />
  <meta name="twitter:image" content="{% block twitter_image %}{{ og_image|default:"https://www.celogos.com.br/static/images/logo/logo-1.svg" }}{% endblock %}" />

  <!-- Favicon e Manifest -->
  <link rel="shortcut icon" type="image/x-icon" href="/static/images/fav.png" />
  <link rel="manifest" href="/static/manifest.webmanifest" />

  <!-- Preconnect para serviços de terceiros -->
  <link rel="preconnect" href="https://global.ketchcdn.com" />
  <link rel="preconnect" href="https://cdn.segment.com" />
  <link rel="preconnect" href="https://cdn.leadster.com.br" />

  <!-- Ketch Smart Tag -->
  <script>
    !(function () {
      (window.semaphore = window.semaphore || []),
        (window.ketch = function () {
          window.semaphore.push(arguments);
        });
      var e = document.createElement("script");
      (e.type = "text/javascript"),
        (e.src =
          "https://global.ketchcdn.com/web/v3/config/centro_educacional_logos/website_smart_tag/boot.js"),
        (e.defer = e.async = !0),
        document.getElementsByTagName("head")[0].appendChild(e);
    })();
  </script>

  <!-- Estrutura de Dados JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Centro Educacional Logos",
      "url": "https://www.celogos.com.br",
      "logo": "/static/images/logo/logo-1.svg",
      "description": "Escola cristã em Ananindeua há 30 anos, oferecendo Educação Infantil, Ensino Fundamental e Ensino Médio com excelência acadêmica e valores cristãos.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Rua Cláudio Sanders, s/n",
        "addressLocality": "Ananindeua",
        "addressRegion": "PA",
        "postalCode": "67030-490",
        "addressCountry": "BR"
      },
      "telephone": "+55-91-3013-0198",
      "email": "contato@celogos.com.br",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "127",
        "bestRating": "5"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+55-91-3013-0198",
        "contactType": "Customer Service",
        "availableLanguage": ["Portuguese"]
      }
    }
  </script>

  {% block json_ld_breadcrumb %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://www.celogos.com.br"
        }{% if breadcrumb_items %}{% for item in breadcrumb_items %},
        {
          "@type": "ListItem",
          "position": {{ forloop.counter|add:1 }},
          "name": "{{ item.name }}",
          "item": "{{ item.url }}"
        }{% endfor %}{% endif %}
      ]
    }
  </script>
  {% endblock %}

  <!-- CSS não-bloqueante via loadCSS -->
  <!-- CSS tree-shaked (PurgeCSS) -->
  <link rel="stylesheet" href="/static/css-purged/swiper.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/static/css-purged/swiper.min.css" /></noscript>
  <link rel="stylesheet" href="/static/css-purged/magnific-popup.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/static/css-purged/magnific-popup.css" /></noscript>
  <link rel="stylesheet" href="/static/css-purged/metismenu.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/static/css-purged/metismenu.css" /></noscript>
  <link rel="stylesheet" href="/static/css-purged/bootstrap.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/static/css-purged/bootstrap.min.css" /></noscript>
  <link rel="stylesheet" href="/static/css-purged/style.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/static/css-purged/style.css" /></noscript>

  <!-- Font Awesome Subset + font-display: swap -->
  <link rel="stylesheet" href="{% static 'fonts-subset/fontawesome-subset.css' %}" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="{% static 'fonts-subset/fontawesome-subset.css' %}" /></noscript>
</head>
